
[supervisord]
nodaemon=false
logfile=/workspaces/tavern.exe/.logs/supervisord.log
pidfile=/workspaces/tavern.exe/.logs/supervisord.pid
childlogdir=/workspaces/tavern.exe/.logs

[unix_http_server]
file=/workspaces/tavern.exe/.logs/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///workspaces/tavern.exe/.logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:frontend]
command=/usr/bin/env npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
directory=/workspaces/tavern.exe/client
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/workspaces/tavern.exe/.logs/vite.log
stderr_logfile=/workspaces/tavern.exe/.logs/vite-error.log
stopasgroup=true
killasgroup=true

[program:backend]
command=/usr/bin/env node server/index.mjs
directory=/workspaces/tavern.exe
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/workspaces/tavern.exe/.logs/server.log
stderr_logfile=/workspaces/tavern.exe/.logs/server-error.log
stopasgroup=true
killasgroup=true
